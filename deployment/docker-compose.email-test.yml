version: '3.8'

services:
  # Base Gin App for email testing
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: base-gin-email-test
    ports:
      - "8001:8001"
    environment:
      # Server Configuration
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
      - SERVER_READ_TIMEOUT=30
      - SERVER_WRITE_TIMEOUT=30
      
      # Database Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=base_gin_test
      - DB_SSLMODE=disable
      - DB_TIMEZONE=UTC
      
      # JWT Configuration
      - JWT_SECRET_KEY=test-jwt-secret-key-for-email-testing
      - JWT_ACCESS_TOKEN_DURATION=15m
      - JWT_REFRESH_TOKEN_DURATION=168h
      
      # Email Configuration for testing
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - EMAIL_USERNAME=
      - EMAIL_PASSWORD=
      - EMAIL_FROM=test@base-gin.local
      
      # Environment
      - ENVIRONMENT=testing
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - app-uploads:/app/uploads
      - app-logs:/app/logs
      - app-tmp:/app/tmp
    networks:
      - email-test
    restart: unless-stopped

  # PostgreSQL for testing
  postgres:
    image: postgres:15-alpine
    container_name: base-gin-postgres-test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=base_gin_test
    ports:
      - "5433:5432"  # Different port to avoid conflict
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    networks:
      - email-test
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d base_gin_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MailHog - SMTP testing tool
  mailhog:
    image: mailhog/mailhog:latest
    container_name: base-gin-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - email-test
    restart: unless-stopped

  # Alternative: Mailpit (more modern and feature-rich)
  mailpit:
    image: axllent/mailpit:latest
    container_name: base-gin-mailpit
    ports:
      - "1026:1025"  # SMTP server (different port to avoid conflict)
      - "8026:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_WEB_ROOT: /
    networks:
      - email-test
    restart: unless-stopped

volumes:
  postgres-test-data:
    driver: local
  app-uploads:
    driver: local
  app-logs:
    driver: local
  app-tmp:
    driver: local

networks:
  email-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

